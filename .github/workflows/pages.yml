name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - name: Instalar Chromium para pruebas
        run: npx playwright install --with-deps chromium
      - name: Validar diario, copias de seguridad y móvil
        run: npm run test:ui
      - run: mkdir -p /tmp/site && cp index.html app.js data.js predictor.js profile.js fatsecret.js cloud.js cloud-config.js style.css /tmp/site/
      - name: Comprobar configuración de GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Explicar cómo activar Pages
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::No se pudo configurar Pages. Revisa Settings > Pages > Build and deployment > Source: GitHub Actions. Habilitar Actions no activa Pages. Consulta el error del paso anterior para distinguir configuración y permisos."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v4
